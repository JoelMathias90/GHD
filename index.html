<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GHD</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main id="painel-habitos" class="painel-habitos">
        <h1 id="titulo" class="titulo">GHD</h1>
        
        <div class="layout-lista">
            <ul id="listHabits" class="listHabits"></ul>
        </div>

        <div class="filtersHabit">
            <legend>Filtros</legend>
            <div>
                <input type="checkbox" name="filterHabit" id="filterCurrentDate" >
                <label for="filterCurrentDate">Hoje </label>
            </div>

        </div>
        <div id="progressContainer" class="progressContainer">
            <div id="progressBar" class="progressBar"></div>
            <div class="progressCountDiv">
                <p>Hábitos concluídos: </p><span id="progressCount" class="progressCount"></span>
            </div>
        </div>

        <button id="addHabitButton" class="addHabitButton" type="button">Adicionar Hábito</button>

        <form id="addHabitForm" class="addHabitForm">

            <h1 class="titulo-form">Criando Hábitos</h1>

            <input id="habitTitleInput" class="habitTitleInput" type="text" name="nome-habito" placeholder="Hábito">

            <fieldset id="habitFrequencyFieldset" class="habitFrequencyFieldset">
                <legend>Frequência</legend>
                <label for="domingo">D</label>
                <input id="domingo" type="checkbox" name="habitFrequencyInput" value="0">
                <label for="segunda">S</label>
                <input id="segunda" type="checkbox" name="habitFrequencyInput" value="1">
                <label for="terca">T</label>
                <input id="terca" type="checkbox" name="habitFrequencyInput" value="2">
                <label for="quarta">Q</label>
                <input id="quarta" type="checkbox" name="habitFrequencyInput" value="3">
                <label for="quinta">Q</label>
                <input id="quinta" type="checkbox" name="habitFrequencyInput" value="4">
                <label for="sexta">S</label>
                <input id="sexta" type="checkbox" name="habitFrequencyInput" value="5">
                <label for="sabado">S</label>
                <input id="sabado" type="checkbox" name="habitFrequencyInput" value="6">
            </fieldset>

            <div class="layout-botoes">
                <button id="submitHabitButton" class="submitHabitButton" type="submit">Criar</button>
                <button id="cancelHabitButton" class="cancelHabitButton" type="reset">Cancelar</button>
            </div>

            <div id="modal" class="modal">
                <p id="texto-modal" class="texto-modal"></p>
            </div>
        </form>
    </main>
    <script src="script.js"></script>
</body>

</html>
