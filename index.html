<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GHD</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main id="painel-habitos" class="painel-habitos">
        <h1 id="titulo" class="titulo">GHD</h1>

        <div class="layout-lista">
            <span id="mensagem-vazio" class="mensagem-vazio">Nenhum Hábito foi adicionado!</span>
            <ul id="lista-habitos" class="lista-habitos escondido"></ul>
        </div>

        <button id="criar-habito" class="criar-habito" type="button">Criar Hábito</button>

        <form id="form-habito" class="form-habito escondido">

            <h1 class="titulo-form">Criando Hábitos</h1>
            
            <input id="nome-habito" class="nome-habito" type="text" name="nome-habito"  placeholder="Hábito">

            <fieldset id="frequencia-habito" class="frequencia-habito">
                <legend>Frequência</legend>
                <label for="domingo">D</label>
                <input id="domingo" type="checkbox" name="dia-semana" value="domingo">
                <label for="segunda">S</label>
                <input id="segunda" type="checkbox" name="dia-semana" value="segunda">
                <label for="terca">T</label>
                <input id="terca" type="checkbox" name="dia-semana" value="terca">
                <label for="quarta">Q</label>
                <input id="quarta" type="checkbox" name="dia-semana" value="quarta">
                <label for="quinta">Q</label>
                <input id="quinta" type="checkbox" name="dia-semana" value="quinta">
                <label for="sexta">S</label>
                <input id="sexta" type="checkbox" name="dia-semana" value="sexta">
                <label for="sabado">S</label>
                <input id="sabado" type="checkbox" name="dia-semana" value="sabado">
            </fieldset>

            <div class="layout-botoes">
                <button id="adicionar-habito" class="adicionar-habito" type="submit">Adicionar</button>
                <button id="cancelar-habito" class="cancelar-habito" type="reset">Cancelar</button>
            </div>

            <div id="modal" class="modal">
                <p id="texto-modal" class="texto-modal"></p>
            </div>
        </form>
    </main>
    <script src="script.js"></script>
</body>

</html>
